name: tsdrp
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy>=1.24
  - scipy>=1.11
  - astropy>=5.3
  - matplotlib>=3.7
  - scikit-image>=0.20
  - seaborn>=0.12
  # Optional: uncomment to enable faster/better cosmic ray rejection
  - astroscrappy>=1.2
  - pip
  - pip:
      # Optional: tool to fill masked values per README (may not be available on conda)
      # Uncomment to install
      - maskfill>=0.1
